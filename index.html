<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá minina esnupi!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        body { 
            text-align: center; 
            font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            padding-bottom: 300px; 
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px; 
            padding: 0 20px;
        }

        h1 { 
            font-weight: 800;
            font-size: 3.8rem;
            color: white;
            text-shadow: 5px 5px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; 
            margin: 0; 
            letter-spacing: -1px;
        }

        .header-gif {
            height: 450px; 
            width: auto;
            transform: rotate(4deg);
        }

        .question-box {
            background: #ffffff;
            color: #000000;
            padding: 18px 30px;
            font-family: 'VT323', monospace; 
            font-size: 1.8rem;
            max-width: 85%;
            width: 520px;
            margin-bottom: 0px; 
            border: 4px solid #000000;
            border-radius: 0px; 
            box-shadow: 8px 8px 0px #000000;
            line-height: 1.2;
            position: relative;
            z-index: 5;
        }

        .question-box::before {
            content: "";
            position: absolute;
            bottom: -16px;
            left: 40px;
            width: 24px;
            height: 20px;
            background: #ffffff;
            border-left: 4px solid #000000;
            border-right: 4px solid #000000;
            z-index: 2;
        }

        .question-box::after {
            content: "";
            position: absolute;
            bottom: -28px;
            left: 44px; 
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-left: 4px solid #000000;
            border-right: 4px solid #000000;
            border-bottom: 4px solid #000000;
            box-shadow: 8px 8px 0px #000000; 
            z-index: 1;
        }

        .parenthesis-text {
            font-size: 1.3rem;
            font-weight: 400;
            display: block;
            margin-top: 6px;
            color: #444444;
        }
        
        .button-area {
            position: relative;
            height: 75px; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -4px; 
            z-index: 6; 
        }
        
        #yes-btn { 
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0; 
            width: 150px;
            height: 75px; 
            cursor: pointer;
            overflow: visible; /* CRITICAL: Allows the explosion to pop out! */
        }

        /* --- THE COMIC EXPLOSION LAYERS --- */
        .boom-layer {
            position: absolute;
            top: 50%; left: 50%;
            width: 320px;
            height: 240px;
            background: #000;
            /* Hand-crafted dynamic jagged explosion polygon */
            clip-path: polygon(50% 0%, 63% 20%, 88% 5%, 75% 32%, 100% 38%, 82% 52%, 98% 75%, 72% 68%, 82% 98%, 58% 82%, 45% 100%, 35% 80%, 12% 95%, 25% 65%, 0% 68%, 20% 48%, 0% 28%, 28% 28%, 15% 5%, 40% 22%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
            opacity: 0;
            pointer-events: none;
        }

        /* Background halftone dots */
        .boom-dots {
            z-index: 0;
            background-color: transparent;
            background-image: radial-gradient(#ffea00 35%, transparent 40%);
            background-size: 14px 14px;
            clip-path: circle(50% at 50% 50%) !important;
        }

        /* Explosion colors matching the image perfectly */
        .boom-black-1 { z-index: 1; background: #000000; }
        .boom-blue    { z-index: 2; background: #1a75ff; }
        .boom-black-2 { z-index: 3; background: #000000; }
        .boom-red     { z-index: 4; background: #ff0022; }
        .boom-black-3 { z-index: 5; background: #000000; }
        .boom-white   { z-index: 6; background: #ffffff; }

        /* --- EXPLOSION ANIMATION ON HOVER --- */
        #yes-btn:hover .boom-dots    { opacity: 1; transform: translate(-50%, -50%) scale(1.6); }
        #yes-btn:hover .boom-black-1 { opacity: 1; transform: translate(-50%, -50%) scale(1.45) rotate(4deg); }
        #yes-btn:hover .boom-blue    { opacity: 1; transform: translate(-50%, -50%) scale(1.35) rotate(4deg); }
        
        #yes-btn:hover .boom-black-2 { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(-2deg); }
        #yes-btn:hover .boom-red     { opacity: 1; transform: translate(-50%, -50%) scale(0.95) rotate(-2deg); }
        
        #yes-btn:hover .boom-black-3 { opacity: 1; transform: translate(-50%, -50%) scale(0.70) rotate(1deg); }
        #yes-btn:hover .boom-white   { opacity: 1; transform: translate(-50%, -50%) scale(0.60) rotate(1deg); }

        /* --- ORIGINAL BUTTON LAYER --- */
        .punk-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px;
            border: 4px solid #000;
            border-radius: 4px;
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.15s ease, opacity 0.15s ease, color 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .green-layer {
            background: #23c45e;
            color: white;
            z-index: 10; /* Keeps the text exactly above the explosion */
            box-shadow: 5px 5px 0px #000;
        }

        /* Erase the green button block to reveal the explosion underneath! */
        #yes-btn:hover .green-layer {
            background-color: transparent;
            color: #000000; /* Swaps text to black so it pops against the white explosion */
            border-color: transparent;
            box-shadow: none;
            transform: scale(1.4) rotate(-3deg);
        }

        .sim-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .sim-tiny-text {
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
        }
        
        #no-btn { 
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px; 
            padding: 0; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 150px; 
            height: 75px; 
            background-color: #f44336; 
            color: white; 
            border: 4px solid #000;
            border-radius: 4px;
            position: fixed; 
            box-shadow: 5px 5px 0px #000;
            z-index: 6;
            transition: left 0.8s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.8s cubic-bezier(0.1, 0.8, 0.3, 1); 
            cursor: pointer;
        }

        .music-player {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 15, 15, 0.85);
            padding: 15px 20px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            align-items: stretch;
            gap: 15px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            width: auto; 
            max-width: 95vw;
        }
        
        .player-left {
            display: flex;
            flex-direction: column;
            width: 220px;
        }

        .player-right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-gif-top {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player-gif-side {
            width: 190px; 
            height: 100%;
            min-height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .music-player p { 
            margin: 0 0 12px 0; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }
        
        .player-controls { display: flex; justify-content: center; gap: 8px; }
        .player-controls button { 
            font-size: 13px; 
            padding: 8px 14px; 
            margin: 0; 
            border-radius: 8px; 
            background: white; 
            color: black; 
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .player-controls button:hover {
            background: #ff0055;
            color: white;
            transform: translateY(-2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { padding-bottom: 220px; }
            .header-container { gap: 15px; }
            h1 { font-size: 2.5rem; text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000; }
            .header-gif { height: 220px; }
            .question-box { font-size: 1.4rem; padding: 15px 20px; width: 90%; }
            #yes-btn, #no-btn { width: 130px; height: 65px; font-size: 20px; }
            .button-area { height: 65px; }
            .sim-tiny-text { font-size: 0.55rem; }
            .music-player { padding: 12px; gap: 10px; width: 95vw; bottom: 15px; }
            .player-left { width: 55%; }
            .player-right { width: 45%; }
            .player-gif-side { width: 100%; min-height: 110px; }
            .player-gif-top { height: 65px; }
            .player-controls button { font-size: 11px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Olá minina esnupi!</h1>
        <img src="braum.gif" alt="Braum" class="header-gif">
    </div>

    <div class="question-box">
        Queres ir dar um passeio e comer gelado?
        <span class="parenthesis-text">(Pode ser pão de alho)</span>
    </div>
    
    <div class="button-area">
        <button id="yes-btn" onclick="notifyMe(event)">
            <!-- The 7-Layer Comic Explosion -->
            <div class="boom-layer boom-dots"></div>
            <div class="boom-layer boom-black-1"></div>
            <div class="boom-layer boom-blue"></div>
            <div class="boom-layer boom-black-2"></div>
            <div class="boom-layer boom-red"></div>
            <div class="boom-layer boom-black-3"></div>
            <div class="boom-layer boom-white"></div>
            
            <!-- Default Visible Button -->
            <div class="punk-layer green-layer">
                <div class="sim-text-wrapper">
                    <span>Sim!</span>
                    <span class="sim-tiny-text">Can't hurt!</span>
                </div>
            </div>
        </button>
        
        <button id="no-btn">Não</button>
    </div>

    <div class="music-player" onclick="event.stopPropagation()">
        
        <div class="player-left">
            <img class="player-gif-top" src="static.gif" alt="Static Top GIF">
            <p id="song-title">🎵 Song 1</p>
            <div class="player-controls">
                <button onclick="prevSong()">⏮ Back</button>
                <button onclick="togglePlay()" id="play-btn">⏸ Pause</button>
                <button onclick="nextSong()">Next ⏭</button>
            </div>
        </div>

        <div class="player-right">
            <img id="dynamic-gif" class="player-gif-side" src="gif1.gif" alt="Dynamic Visualizer">
        </div>

    </div>

    <audio id="myAudio" preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        var songs = ['music.mp3', 'music2.mp3', 'music3.mp3', 'music4.mp3'];
        var gifs = ['gif1.gif', 'gif2.gif', 'gif3.gif', 'gif4.gif'];
        var songTitles = ['🎵 Song 1', '🎵 Song 2', '🎵 Song 3', '🎵 Song 4']; 
        
        var currentSongIndex = 0;
        var audio = document.getElementById('myAudio');
        var isPlaying = false;
        var firstPlayStarted = false;
        var hasMoved = false; 
        
        var mobileSlipCount = 0;

        document.addEventListener('click', startFirstPlay);
        document.addEventListener('touchstart', startFirstPlay);

        function snapButtons() {
            if (!hasMoved) { 
                var yesBtn = document.getElementById('yes-btn');
                var noBtn = document.getElementById('no-btn');
                var yesRect = yesBtn.getBoundingClientRect();
                
                var gap = window.innerWidth < 768 ? 15 : 25; 
                noBtn.style.left = (yesRect.right + gap) + 'px';
                noBtn.style.top = yesRect.top + 'px';
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            snapButtons();
            
            var noBtn = document.getElementById('no-btn');
            
            noBtn.addEventListener('mouseover', function(e) {
                if (window.innerWidth > 768) {
                    moveButton();
                }
            });

            noBtn.addEventListener('click', function(e) {
                if (window.innerWidth > 768) {
                    notifyNo(e);
                }
            });

            noBtn.addEventListener('touchstart', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault(); 
                    
                    if (mobileSlipCount < 3) {
                        mobileSlipCount++;
                        moveButton();
                    } else {
                        notifyNo(e);
                    }
                }
            });

            audio.addEventListener('ended', function() {
                nextSong();
            });
        });

        window.addEventListener('resize', snapButtons);

        function startFirstPlay() {
            if (!firstPlayStarted) {
                firstPlayStarted = true; 
                audio.play().then(function() {
                    isPlaying = true;
                    document.getElementById('play-btn').innerText = "⏸ Pause";
                }).catch(function(error) {
                    firstPlayStarted = false; 
                    console.log("Audio waiting for a specific layout click.");
                });
            }
        }

        function moveButton() {
            hasMoved = true; 
            startFirstPlay(); 
            
            var btn = document.getElementById('no-btn');
            var currentX = btn.offsetLeft;
            var currentY = btn.offsetTop;

            var maxSlide = 140; 
            var offsetX = (Math.random() - 0.5) * 2 * maxSlide;
            var offsetY = (Math.random() - 0.5) * 2 * maxSlide;

            var newX = currentX + offsetX;
            var newY = currentY + offsetY;

            var padding = 80;
            if (newX < padding) newX = padding;
            if (newX > window.innerWidth - btn.offsetWidth - padding) newX = window.innerWidth - btn.offsetWidth - padding;
            if (newY < padding) newY = padding;
            if (newY > window.innerHeight - btn.offsetHeight - padding) newY = window.innerHeight - btn.offsetHeight - padding;

            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
        }

        function updateSong() {
            audio.src = songs[currentSongIndex];
            
            document.getElementById('dynamic-gif').src = gifs[currentSongIndex] + "?v=" + Date.now();
            document.getElementById('song-title').innerText = songTitles[currentSongIndex];
            
            if (isPlaying) {
                audio.play();
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            isPlaying = true; 
            firstPlayStarted = true;
            updateSong();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            isPlaying = true;
            firstPlayStarted = true;
            updateSong();
        }

        function togglePlay() {
            firstPlayStarted = true;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('play-btn').innerText = "▶ Play";
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        // YES Notification
        function notifyMe(event) {
            event.stopPropagation();
            startFirstPlay(); 
            
            var greenLayer = document.querySelector('.green-layer');
            greenLayer.innerHTML = "<div class='sim-text-wrapper'>A enviar... ❤️</div>";

            fetch("https://formspree.io/f/xeewqyjp", {
                method: "POST",
                body: JSON.stringify({ Status: "SHE SAID YES! 😍" }),
                headers: { 'Content-Type': 'application/json' }
            }).then(function() {
                alert("Yay! I can't wait! 🥰❤️");
                greenLayer.innerHTML = "<div class='sim-text-wrapper'><span>Sim!</span><span class='sim-tiny-text'>Can't hurt!</span></div>";
            }).catch(function() {
                alert("Yay! I can't wait! 🥰❤️");
                greenLayer.innerHTML = "<div class='sim-text-wrapper'><span>Sim!</span><span class='sim-tiny-text'>Can't hurt!</span></div>";
            });
        }

        // NO Notification
        function notifyNo(event) {
            event.stopPropagation();
            startFirstPlay(); 
            
            var noBtn = document.getElementById('no-btn');
            noBtn.innerText = "That's ok :/"; 

            fetch("https://formspree.io/f/xeewqyjp", {
                method: "POST",
                body: JSON.stringify({ Status: "Nope" }), 
                headers: { 'Content-Type': 'application/json' }
            }).then(function() {
                alert("Está bem... 🥺");
                noBtn.innerText = "Não"; 
            }).catch(function() {
                alert("Está bem... 🥺");
                noBtn.innerText = "Não";
            });
        }
    </script>
</body>
</html>
