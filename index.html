<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you go out with me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        body { 
            text-align: center; 
            font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }
        
        h1 { 
            font-weight: 800;
            font-size: 3.5rem;
            /* Thick comic book line art text effect */
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; 
            margin-bottom: 40px; 
            letter-spacing: -1px;
            padding: 0 20px;
        }
        
        .button-area {
            position: relative;
            height: 120px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        button { 
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px; 
            padding: 15px 40px; 
            margin: 10px; 
            cursor: pointer; 
            border: 4px solid #000; /* Bold comic outlining */
            border-radius: 4px; /* Harder zine-style edges */
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.15s ease;
        }
        
        /* Base Yes Button */
        #yes-btn { 
            background-color: #23c45e; 
            color: white; 
            box-shadow: 5px 5px 0px #000;
            position: relative;
            z-index: 5;
        }
        
        /* --- SPIDER-VERSE PUNK BACKGROUND LAYERS --- */
        #yes-btn::before, #yes-btn::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            z-index: -1;
            opacity: 0;
            border: 4px solid #000;
            transition: transform 0.15s ease, opacity 0.1s ease;
        }
        
        /* Layer 1: Jagged Hot Pink Halftone-style Cutout */
        #yes-btn::before {
            background: #ff0055;
            clip-path: polygon(6% 0%, 94% 11%, 100% 83%, 78% 93%, 12% 100%, 0% 41%, 15% 30%);
        }
        
        /* Layer 2: Sharp Punk Yellow Electric Shockwave */
        #yes-btn::after {
            background: #ffea00;
            clip-path: polygon(0% 20%, 85% 0%, 100% 40%, 90% 95%, 45% 85%, 5% 100%);
        }
        
        /* --- EXPLOSIVE SPIDER-PUNK HOVER STATE --- */
        #yes-btn:hover {
            background-color: #00ff66; /* Neon Shock Green */
            color: #000;
            box-shadow: 7px 7px 0px #000;
            transform: scale(1.25) rotate(-5deg);
        }
        
        /* Shatter the Pink layer out to the bottom left */
        #yes-btn:hover::before {
            opacity: 1;
            transform: scale(1.2) translate(-15px, 12px) rotate(12deg);
        }
        
        /* Shatter the Yellow layer out to the top right */
        #yes-btn:hover::after {
            opacity: 1;
            transform: scale(1.35) translate(18px, -10px) rotate(-15deg);
        }
        
        /* Soap bar No Button */
        #no-btn { 
            background-color: #f44336; 
            color: white; 
            position: fixed; 
            box-shadow: 5px 5px 0px #000;
            z-index: 4;
            transition: left 0.8s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.8s cubic-bezier(0.1, 0.8, 0.3, 1); 
        }

        /* Music Player UI */
        .music-player {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 15, 15, 0.85);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            width: 240px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        
        .player-gif {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .music-player p { 
            margin: 0 0 12px 0; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }
        
        .player-controls { display: flex; justify-content: center; gap: 8px; }
        .player-controls button { 
            font-size: 13px; 
            padding: 8px 14px; 
            margin: 0; 
            border-radius: 8px; 
            background: white; 
            color: black; 
            font-weight: 600;
            border: none;
        }
        .player-controls button:hover {
            background: #ff0055;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body onclick="startFirstPlay()">

    <h1>Olá minina esnupi, queres ir passear e comer gelado /também pode ser pão de alho/</h1>
    
    <div class="button-area">
        <button id="yes-btn" onclick="notifyMe(event)">Yes!</button>
        <button id="no-btn" onmouseover="moveButton()">No</button>
    </div>

    <div class="music-player" onclick="event.stopPropagation()">
        <img id="song-gif" class="player-gif" src="gif1.gif" alt="Music Visualizer">
        <p id="song-title">🎵 Song 1</p>
        <div class="player-controls">
            <button onclick="prevSong()">⏮ Back</button>
            <button onclick="togglePlay()" id="play-btn">⏸ Pause</button>
            <button onclick="nextSong()">Next ⏭</button>
        </div>
    </div>

    <audio id="myAudio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Clean layout calculations to place No button beautifully next to Yes
        window.addEventListener('DOMContentLoaded', function() {
            var yesBtn = document.getElementById('yes-btn');
            var noBtn = document.getElementById('no-btn');
            var yesRect = yesBtn.getBoundingClientRect();
            
            noBtn.style.left = (yesRect.right + 20) + 'px';
            noBtn.style.top = yesRect.top + 'px';
        });

        // --- Soap Bar "No" Button Sliding Physics ---
        function moveButton() {
            var btn = document.getElementById('no-btn');
            var currentX = btn.offsetLeft;
            var currentY = btn.offsetTop;

            var maxSlide = 140; 
            var offsetX = (Math.random() - 0.5) * 2 * maxSlide;
            var offsetY = (Math.random() - 0.5) * 2 * maxSlide;

            var newX = currentX + offsetX;
            var newY = currentY + offsetY;

            var padding = 80;
            if (newX < padding) newX = padding;
            if (newX > window.innerWidth - btn.offsetWidth - padding) newX = window.innerWidth - btn.offsetWidth - padding;
            if (newY < padding) newY = padding;
            if (newY > window.innerHeight - btn.offsetHeight - padding) newY = window.innerHeight - btn.offsetHeight - padding;

            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
        }

        // --- Music & GIF Sync System ---
        var songs = ['music.mp3', 'music2.mp3', 'music3.mp3'];
        var gifs = ['gif1.gif', 'gif2.gif', 'gif3.gif'];
        var songTitles = ['🎵 Song 1', '🎵 Song 2', '🎵 Song 3']; 
        
        var currentSongIndex = 0;
        var audio = document.getElementById('myAudio');
        var isPlaying = false;
        var firstPlayStarted = false;

        function startFirstPlay() {
            if (!firstPlayStarted) {
                audio.play();
                isPlaying = true;
                firstPlayStarted = true;
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        function updateSong() {
            audio.src = songs[currentSongIndex];
            document.getElementById('song-gif').src = gifs[currentSongIndex];
            document.getElementById('song-title').innerText = songTitles[currentSongIndex];
            if (isPlaying) {
                audio.play();
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            isPlaying = true; 
            firstPlayStarted = true;
            updateSong();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            isPlaying = true;
            firstPlayStarted = true;
            updateSong();
        }

        function togglePlay() {
            firstPlayStarted = true;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('play-btn').innerText = "▶ Play";
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        // --- Invisible Formspree Notification ---
        function notifyMe(event) {
            event.stopPropagation();
            
            var yesBtn = document.getElementById('yes-btn');
            yesBtn.innerText = "Sending... ❤️";

            fetch("https://formspree.io/f/xeewqyjp", {
                method: "POST",
                body: JSON.stringify({ Status: "SHE SAID YES! 😍" }),
                headers: { 'Content-Type': 'application/json' }
            }).then(function() {
                alert("Yay! I can't wait! 🥰❤️");
                yesBtn.innerText = "Yes!";
            }).catch(function() {
                alert("Yay! I can't wait! 🥰❤️");
                yesBtn.innerText = "Yes!";
            });
        }
    </script>
</body>
</html>
