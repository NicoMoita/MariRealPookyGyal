<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Will you go out with me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            text-align: center; 
            font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }
        
        h1 { 
            font-weight: 800;
            font-size: 3rem;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000; 
            margin-bottom: 30px; 
            letter-spacing: -1px;
        }
        
        button { 
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 22px; 
            padding: 15px 35px; 
            margin: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        #yes-btn { 
            background-color: #4CAF50; 
            color: white; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
        
        /* Spider-Punk Highlight Effect */
        #yes-btn:hover {
            background-color: #00ff66; 
            color: #000000;
            font-weight: 800;
            box-shadow: 0 0 0 4px #000, 0 0 0 8px #ff0055, 0 0 25px #00f0ff;
            transform: scale(1.15) rotate(-4deg);
        }
        
        #no-btn { 
            background-color: #f44336; 
            color: white; 
            position: absolute; 
            left: calc(50% + 80px); 
            top: calc(50% + 35px);
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            transition: left 0.9s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.9s cubic-bezier(0.1, 0.8, 0.3, 1); 
        }

        .music-player {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 15, 15, 0.8);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            width: 240px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        
        .player-gif {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .music-player p { 
            margin: 0 0 12px 0; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }
        
        .player-controls { display: flex; justify-content: center; gap: 8px; }
        .player-controls button { 
            font-size: 13px; 
            padding: 8px 14px; 
            margin: 0; 
            border-radius: 8px; 
            background: white; 
            color: black; 
            font-weight: 600;
        }
        .player-controls button:hover {
            background: #ff0055;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body onclick="startFirstPlay()">

    <h1>Will you go out with me?</h1>
    
    <div>
        <button id="yes-btn" onclick="notifyMe(event)">Yes!</button>
        <button id="no-btn" onmouseover="moveButton()">No</button>
    </div>

    <div class="music-player" onclick="event.stopPropagation()">
        <img id="song-gif" class="player-gif" src="gif1.gif" alt="Music Visualizer">
        <p id="song-title">🎵 Song
