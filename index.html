<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Will you go out with me?</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Arial', sans-serif; 
            background: url('https://i.pinimg.com/1200x/8a/a7/2a/8aa72a3321d0459527731ab4ee0c1c18.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        h1 { text-shadow: 2px 2px 4px #000; }
        button { font-size: 20px; padding: 15px 30px; margin: 10px; cursor: pointer; border: none; border-radius: 10px; }
        #yes-btn { background-color: #4CAF50; color: white; }
        #no-btn { background-color: #f44336; color: white; position: absolute; transition: all 0.2s ease; }
    </style>
</head>
<body onclick="document.getElementById('myAudio').play()">

    <h1>Will you go out with me?</h1>
    
    <div>
        <button id="yes-btn" onclick="notifyMe()">Yes!</button>
        <button id="no-btn" onmouseover="moveButton()">No</button>
    </div>

    <audio id="myAudio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        function moveButton() {
            var btn = document.getElementById('no-btn');
            // Randomly position the button within the screen
            var x = Math.random() * (window.innerWidth - 100);
            var y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function notifyMe() {
            // Replace with your actual email
            window.location.href = "mailto:nrmoita123@gmail.com?subject=SHE SAID YES!&body=She clicked Yes on your website!";
        }
    </script>
</body>
</html>
