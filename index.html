<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá, Mari!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            text-align: center; font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover; color: white; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0; overflow: hidden; padding-bottom: 200px;
        }

        h1 { font-weight: 800; font-size: 3.8rem; color: white; text-shadow: 5px 5px 0px #000; margin: 0; }
        .esnupi-subtitle { font-size: 2rem; display: block; font-weight: 600; color: white; -webkit-text-stroke: 1px #000; }
        .header-gif { height: 250px; width: auto; transform: rotate(4deg); }

        /* --- BOLHA DE TEXTO ESTILO PIXEL ART (Pokémon/GameBoy) --- */
        .question-box {
            background: #ffffff; color: #000000; padding: 25px;
            font-family: 'VT323', monospace; font-size: 1.8rem;
            max-width: 85%; width: 520px; border: 4px solid #000000;
            border-radius: 20px; position: relative; margin-top: 20px;
        }
        .question-box::after {
            content: ""; position: absolute; bottom: -20px; left: 50px;
            border-width: 20px 20px 0 0; border-style: solid; border-color: #000 transparent;
        }

        .parenthesis-text { font-size: 1.2rem; color: #555; display: block; margin-top: 10px; font-style: italic; }

        .button-area { margin-top: 30px; display: flex; gap: 20px; }
        #yes-btn, #no-btn { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 20px; padding: 15px 30px; border: 3px solid #000; cursor: pointer; }
        #yes-btn { background: #23c45e; color: white; }
        #no-btn { background: #f44336; color: white; }

        .music-player { margin-top: 40px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px; display: flex; align-items: center; gap: 20px; }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .header-gif { height: 150px; }
            .question-box { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Olá, Mari!<span class="esnupi-subtitle">Minina Esnupi</span></h1>
        <img src="braum.gif" alt="Braum" class="header-gif">
    </div>

    <div class="question-box">
        Queres ir dar um passeio e comer gelado?
        <span class="parenthesis-text">*Também pode ser pão de alho</span>
    </div>

    <div class="button-area">
        <button id="yes-btn" onclick="alert('Yay! 🥰')">Sim!</button>
        <button id="no-btn">Não</button>
    </div>

</body>
</html>
