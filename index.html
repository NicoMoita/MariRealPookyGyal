<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you go out with me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        body { 
            text-align: center; 
            font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }
        
        h1 { 
            font-weight: 800;
            font-size: 3.5rem;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; 
            margin-bottom: 40px; 
            letter-spacing: -1px;
            padding: 0 20px;
        }
        
        .button-area {
            position: relative;
            height: 120px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 3-Layer Spider-Verse Button System */
        #yes-btn { 
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
            margin: 10px;
            width: 150px;
            height: 65px;
            cursor: pointer;
        }

        .punk-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px;
            border: 4px solid #000;
            border-radius: 4px;
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.15s ease, opacity 0.15s ease;
        }

        /* Bottom Layer: Punk Yellow */
        .yellow-layer {
            background: #ffea00;
            z-index: 1;
            clip-path: polygon(2% 8%, 98% 0%, 100% 85%, 88% 95%, 15% 100%, 0% 40%);
            opacity: 0;
            transform: scale(0.8);
        }

        /* Middle Layer: Jagged Hot Pink */
        .pink-layer {
            background: #ff0055;
            z-index: 2;
            clip-path: polygon(5% 0%, 95% 10%, 100% 80%, 75% 95%, 10% 98%, 0% 50%);
            opacity: 0;
            transform: scale(0.8);
        }

        /* Top Layer: Central Neon Green (Always stays readable!) */
        .green-layer {
            background: #23c45e;
            color: white;
            z-index: 3;
            box-shadow: 5px 5px 0px #000;
        }
        
        /* --- Perfected Explosive Hover Effects --- */
        #yes-btn:hover .green-layer {
            background-color: #00ff66;
            color: #000;
            transform: scale(1.15) rotate(-5deg);
            box-shadow: 6px 6px 0px #000;
        }
        
        #yes-btn:hover .pink-layer {
            opacity: 1;
            transform: scale(1.2) translate(-14px, 12px) rotate(8deg);
        }
        
        #yes-btn:hover .yellow-layer {
            opacity: 1;
            transform: scale(1.3) translate(16px, -10px) rotate(-12deg);
        }
        
        /* Soap bar No Button */
        #no-btn { 
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px; 
            padding: 15px 40px;
            background-color: #f44336; 
            color: white; 
            border: 4px solid #000;
            border-radius: 4px;
            position: fixed; 
            box-shadow: 5px 5px 0px #000;
            z-index: 4;
            transition: left 0.8s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.8s cubic-bezier(0.1, 0.8, 0.3, 1); 
        }

        /* Music Player UI */
        .music-player {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 15, 15, 0.85);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            width: 240px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        
        .player-gif {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .music-player p { 
            margin: 0 0 12px 0; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }
        
        .player-controls { display: flex; justify-content: center; gap: 8px; }
        .player-controls button { 
            font-size: 13
