<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá minina esnupi!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        body { 
            text-align: center; 
            font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            padding-bottom: 300px; 
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px; 
            padding: 0 20px;
        }

        h1 { 
            font-weight: 800;
            font-size: 3.8rem;
            color: white;
            text-shadow: 5px 5px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; 
            margin: 0; 
            letter-spacing: -1px;
        }

        .header-gif {
            height: 450px; 
            width: auto;
            transform: rotate(4deg);
        }

        .question-box {
            background: #ffffff;
            color: #000000;
            padding: 18px 30px;
            font-family: 'VT323', monospace; 
            font-size: 1.8rem;
            max-width: 85%;
            width: 520px;
            margin-bottom: 0px; 
            border: 4px solid #000000;
            border-radius: 0px; 
            box-shadow: 8px 8px 0px #000000;
            line-height: 1.2;
            position: relative;
            z-index: 5;
        }

        .question-box::before {
            content: "";
            position: absolute;
            bottom: -16px;
            left: 40px;
            width: 24px;
            height: 20px;
            background: #ffffff;
            border-left: 4px solid #000000;
            border-right: 4px solid #000000;
            z-index: 2;
        }

        .question-box::after {
            content: "";
            position: absolute;
            bottom: -28px;
            left: 44px; 
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-left: 4px solid #000000;
            border-right: 4px solid #000000;
            border-bottom: 4px solid #000000;
            box-shadow: 8px 8px 0px #000000; 
            z-index: 1;
        }

        .parenthesis-text {
            font-size: 1.3rem;
            font-weight: 400;
            display: block;
            margin-top: 6px;
            color: #444444;
        }
        
        .button-area {
            position: relative;
            height: 75px; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -4px; 
            z-index: 6; 
        }
        
        #yes-btn { 
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0; 
            width: 150px;
            height: 75px; 
            cursor: pointer;
        }

        .punk-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px;
            border: 4px solid #000;
            border-radius: 4px;
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.15s ease, opacity 0.15s ease;
        }

        .yellow-dots {
            background-color: transparent;
            background-image: radial-gradient(#ffea00 35%, transparent 40%);
            background-size: 14px 14px;
            border: none; 
            z-index: 1;
            opacity: 0;
            transform: scale(0.8);
        }

        .blue-boom {
            background: #1a75ff;
            z-index: 2;
            clip-path: polygon(2% 8%, 100% 0%, 90% 40%, 100% 85%, 88% 95%, 15% 100%, 0% 40%);
            opacity: 0;
            transform: scale(0.8);
        }

        .red-boom {
            background: #ff0022;
            z-index: 3;
            clip-path: polygon(5% 0%, 95% 10%, 100% 80%, 75% 95%, 10% 98%, 0% 50%);
            opacity: 0;
            transform: scale(0.8);
        }

        .green-layer {
            background: #23c45e;
            color: white;
            z-index: 4;
            box-shadow: 5px 5px 0px #000;
        }

        .sim-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .sim-tiny-text {
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
        }
        
        #yes-btn:hover .green-layer {
            background-color: #00ff66;
            color: #000; 
            transform: scale(1.15) rotate(-5deg); 
            box-shadow: 6px 6px 0px #000;
        }
        
        #yes-btn:hover .red-boom {
            opacity: 1;
            transform: scale(1.25) translate(-15px, 15px) rotate(8deg);
        }
        
        #yes-btn:hover .blue-boom {
            opacity: 1;
            transform: scale(1.3) translate(18px, -12px) rotate(-10deg);
        }

        #yes-btn:hover .yellow-dots {
            opacity: 1;
            transform: scale(1.6);
        }
        
        #no-btn { 
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 24px; 
            padding: 0; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 150px; 
            height: 75px; 
            background-color: #f44336; 
            color: white; 
            border: 4px solid #000;
            border-radius: 4px;
            position: fixed; 
            box-shadow: 5px 5px 0px #000;
            z-index: 6;
            transition: left 0.8s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.8s cubic-bezier(0.1, 0.8, 0.3, 1); 
            cursor: pointer;
        }

        /* --- Split-Screen Music Player UI --- */
        .music-player {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 15, 15, 0.85);
            padding: 15px 20px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            align-items: stretch;
            gap: 15px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            width: auto; 
            max-width: 95vw;
        }
        
        .player-left {
            display: flex;
            flex-direction: column;
            width: 220px;
        }

        .player-right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- The Retro Cassette Key Setup --- */
        .cassette-container {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
            margin-top: 18px; /* Pushes the cassette down to make room for buttons sticking out */
        }

        .player-gif-top {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 3;
        }

        .track-indicators {
            position: absolute;
            top: -18px; /* Sticks the buttons out of the top! */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px; /* Tight gap just like mechanical keys */
            z-index: 1; /* Puts them behind the edge of the cassette image */
        }

        .tape-btn {
            width: 24px;
            height: 35px;
            background-color: #333;
            border: 2px solid #111;
            border-radius: 4px 4px 0 0; /* Rounded top edges, flat bottoms */
            position: relative;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.15s ease;
            border-bottom: 7px solid #e0e0e0; /* The white unpressed stripe */
            box-shadow: inset 0px 2px 0px rgba(255, 255, 255, 0.15);
        }

        /* This creates the textured grip dots on the buttons! */
        .tape-btn::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 3px;
            background-image: radial-gradient(#111 40%, transparent 40%);
            background-size: 3px 3px;
            opacity: 0.8;
        }

        /* The 'Pressed Down' Active State */
        .tape-btn.active-btn {
            transform: translateY(8px); /* Physically pushes the button down */
            border-bottom: 7px solid #ff0022; /* Red stripe */
            background-color: #222; /* Darkens slightly when pressed */
            box-shadow: inset 0px 4px 6px rgba(0,0,0,0.8);
        }

        .player-gif-side {
            width: 190px; 
            height: 100%;
            min-height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .player-controls { display: flex; justify-content: center; gap: 8px; }
        .player-controls button { 
            font-size: 13px; 
            padding: 8px 14px; 
            margin: 0; 
            border-radius: 8px; 
            background: white; 
            color: black; 
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .player-controls button:hover {
            background: #ff0055;
            color: white;
            transform: translateY(-2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { padding-bottom: 220px; }
            .header-container { gap: 15px; }
            h1 { font-size: 2.5rem; text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000; }
            .header-gif { height: 220px; }
            .question-box { font-size: 1.4rem; padding: 15px 20px; width: 90%; }
            #yes-btn, #no-btn { width: 130px; height: 65px; font-size: 20px; }
            .button-area { height: 65px; }
            .sim-tiny-text { font-size: 0.55rem; }
            .music-player { padding: 12px; gap: 10px; width: 95vw; bottom: 15px; }
            .player-left { width: 55%; }
            .player-right { width: 45%; }
            .player-gif-side { width: 100%; min-height: 110px; }
            .player-gif-top { height: 65px; }
            .player-controls button { font-size: 11px; padding: 6px 10px; }
            
            /* Responsive Retro Buttons for small screens */
            .tape-btn { width: 20px; height: 30px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Olá minina esnupi!</h1>
        <img src="braum.gif" alt="Braum" class="header-gif">
    </div>

    <div class="question-box">
        Queres ir dar um passeio e comer gelado?
        <span class="parenthesis-text">(Pode ser pão de alho)</span>
    </div>
    
    <div class="button-area">
        <button id="yes-btn" onclick="notifyMe(event)">
            <div class="punk-layer yellow-dots"></div>
            <div class="punk-layer blue-boom"></div>
            <div class="punk-layer red-boom"></div>
            
            <div class="punk-layer green-layer">
                <div class="sim-text-wrapper">
                    <span>Sim!</span>
                    <span class="sim-tiny-text">Can't hurt!</span>
                </div>
            </div>
        </button>
        
        <button id="no-btn">Não</button>
    </div>

    <div class="music-player" onclick="event.stopPropagation()">
        
        <div class="player-left">
            <div class="cassette-container">
                <div class="track-indicators">
                    <div class="tape-btn active-btn"></div> <div class="tape-btn"></div>            <div class="tape-btn"></div>            <div class="tape-btn"></div>            </div>
                <img class="player-gif-top" src="static.gif" alt="Static Top GIF">
            </div>
            
            <div class="player-controls">
                <button onclick="prevSong()">⏮ Back</button>
                <button onclick="togglePlay()" id="play-btn">⏸ Pause</button>
                <button onclick="nextSong()">Next ⏭</button>
            </div>
        </div>

        <div class="player-right">
            <img id="dynamic-gif" class="player-gif-side" src="gif1.gif" alt="Dynamic Visualizer">
        </div>

    </div>

    <audio id="myAudio" preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        var songs = ['music.mp3', 'music2.mp3', 'music3.mp3', 'music4.mp3'];
        var gifs = ['gif1.gif', 'gif2.gif', 'gif3.gif', 'gif4.gif'];
        
        var currentSongIndex = 0;
        var audio = document.getElementById('myAudio');
        var isPlaying = false;
        var firstPlayStarted = false;
        var hasMoved = false; 
        
        var mobileSlipCount = 0;

        document.addEventListener('click', startFirstPlay);
        document.addEventListener('touchstart', startFirstPlay);

        function snapButtons() {
            if (!hasMoved) { 
                var yesBtn = document.getElementById('yes-btn');
                var noBtn = document.getElementById('no-btn');
                var yesRect = yesBtn.getBoundingClientRect();
                
                var gap = window.innerWidth < 768 ? 15 : 25; 
                noBtn.style.left = (yesRect.right + gap) + 'px';
                noBtn.style.top = yesRect.top + 'px';
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            snapButtons();
            
            var noBtn = document.getElementById('no-btn');
            
            noBtn.addEventListener('mouseover', function(e) {
                if (window.innerWidth > 768) {
                    moveButton();
                }
            });

            noBtn.addEventListener('click', function(e) {
                if (window.innerWidth > 768) {
                    notifyNo(e);
                }
            });

            noBtn.addEventListener('touchstart', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault(); 
                    
                    if (mobileSlipCount < 3) {
                        mobileSlipCount++;
                        moveButton();
                    } else {
                        notifyNo(e);
                    }
                }
            });

            audio.addEventListener('ended', function() {
                nextSong();
            });
        });

        window.addEventListener('resize', snapButtons);

        function startFirstPlay() {
            if (!firstPlayStarted) {
                firstPlayStarted = true; 
                audio.play().then(function() {
                    isPlaying = true;
                    document.getElementById('play-btn').innerText = "⏸ Pause";
                }).catch(function(error) {
                    firstPlayStarted = false; 
                    console.log("Audio waiting for a specific layout click.");
                });
            }
        }

        function moveButton() {
            hasMoved = true; 
            startFirstPlay(); 
            
            var btn = document.getElementById('no-btn');
            var currentX = btn.offsetLeft;
            var currentY = btn.offsetTop;

            var maxSlide = 140; 
            var offsetX = (Math.random() - 0.5) * 2 * maxSlide;
            var offsetY = (Math.random() - 0.5) * 2 * maxSlide;

            var newX = currentX + offsetX;
            var newY = currentY + offsetY;

            var padding = 80;
            if (newX < padding) newX = padding;
            if (newX > window.innerWidth - btn.offsetWidth - padding) newX = window.innerWidth - btn.offsetWidth - padding;
            if (newY < padding) newY = padding;
            if (newY > window.innerHeight - btn.offsetHeight - padding) newY = window.innerHeight - btn.offsetHeight - padding;

            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
        }

        function updateSong() {
            audio.src = songs[currentSongIndex];
            document.getElementById('dynamic-gif').src = gifs[currentSongIndex] + "?v=" + Date.now();
            
            // Updates the physical retro buttons
            var btns = document.querySelectorAll('.tape-btn');
            btns.forEach(function(btn, index) {
                if(index === currentSongIndex) {
                    btn.classList.add('active-btn');
                } else {
                    btn.classList.remove('active-btn');
                }
            });
            
            if (isPlaying) {
                audio.play();
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            isPlaying = true; 
            firstPlayStarted = true;
            updateSong();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            isPlaying = true;
            firstPlayStarted = true;
            updateSong();
        }

        function togglePlay() {
            firstPlayStarted = true;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('play-btn').innerText = "▶ Play";
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }
        }

        // YES Notification
        function notifyMe(event) {
            event.stopPropagation();
            startFirstPlay(); 
            
            var greenLayer = document.querySelector('.green-layer');
            greenLayer.innerHTML = "<div class='sim-text-wrapper'>A enviar... ❤️</div>";

            fetch("https://formspree.io/f/xeewqyjp", {
                method: "POST",
                body: JSON.stringify({ Status: "SHE SAID YES! 😍" }),
                headers: { 'Content-Type': 'application/json' }
            }).then(function() {
                alert("Yay! I can't wait! 🥰❤️");
                greenLayer.innerHTML = "<div class='sim-text-wrapper'><span>Sim!</span><span class='sim-tiny-text'>Can't hurt!</span></div>";
            }).catch(function() {
                alert("Yay! I can't wait! 🥰❤️");
                greenLayer.innerHTML = "<div class='sim-text-wrapper'><span>Sim!</span><span class='sim-tiny-text'>Can't hurt!</span></div>";
            });
        }

        // NO Notification
        function notifyNo(event) {
            event.stopPropagation();
            startFirstPlay(); 
            
            var noBtn = document.getElementById('no-btn');
            noBtn.innerText = "That's ok :/"; 

            fetch("https://formspree.io/f/xeewqyjp", {
                method: "POST",
                body: JSON.stringify({ Status: "Nope" }), 
                headers: { 'Content-Type': 'application/json' }
            }).then(function() {
                alert("Está bem... 🥺");
                noBtn.innerText = "Não"; 
            }).catch(function() {
                alert("Está bem... 🥺");
                noBtn.innerText = "Não";
            });
        }
    </script>
</body>
</html>
