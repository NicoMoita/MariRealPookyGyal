<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá, Mari!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            text-align: center; font-family: 'Poppins', sans-serif; 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover; color: white; height: 100vh;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            margin: 0; overflow: hidden; padding-top: 8vh;
        }

        /* --- OVERLAY INICIAL --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111111; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; transition: opacity 0.6s ease; cursor: pointer;
        }

        .tap-text { 
            position: relative; 
            font-family: 'VT323', monospace; font-size: 2.5rem; 
            color: #ffffff; background: #000000; padding: 20px 40px; 
            border: 4px solid #ffffff; box-shadow: 8px 8px 0px #ff00ff; 
            animation: pulse 1.5s infinite; 
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- SNOOPY LYING ON TOP --- */
        .start-snoopy {
            position: absolute;
            bottom: 100%; 
            left: 50%;
            transform: translateX(-50%); 
            width: 110px; 
            margin-bottom: -4px; 
            pointer-events: none; 
            z-index: 10;
        }

        /* --- DECORAÇÃO ESTRELAS --- */
        .star-decoration { position: absolute; width: 180px; z-index: 0; opacity: 0.6; pointer-events: none; }
        .star-top-left { top: 1%; left: 1%; } .star-top-right { top: 2%; right: 1%; }
        .star-bottom-left { bottom: 15%; left: 1%; } .star-bottom-right { bottom: 12%; right: 1%; }

        /* --- CABEÇALHO --- */
        .header-container { display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 20px; z-index: 5; }
        h1 { font-weight: 800; font-size: 3.8rem; color: white; text-shadow: 5px 5px 0px #000; margin: 0; line-height: 1.1; }
        .esnupi-subtitle { font-size: 2rem; display: block; font-weight: 600; color: white; -webkit-text-stroke: 1px #000; }
        .header-gif { height: 250px; transform: rotate(4deg); }

        /* --- BOLHA POKÉMON --- */
        .question-box {
            background: #ffffff; color: #000000; padding: 25px;
            font-family: 'VT323', monospace; font-size: 1.8rem;
            max-width: 90%; width: 500px; border: 4px solid #000000;
            border-radius: 20px; position: relative; z-index: 5;
        }
        .question-box::after {
            content: ""; position: absolute; bottom: -20px; left: 50px;
            border-width: 20px 20px 0 0; border-style: solid; border-color: #000 transparent;
        }
        .parenthesis-text { font-size: 1.2rem; color: #555; display: block; margin-top: 10px; }

        /* --- BOTÕES --- */
        .button-area { margin-top: 30px; display: flex; gap: 20px; z-index: 6; }
        #yes-btn, #no-btn { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 20px; padding: 15px 30px; border: 3px solid #000; cursor: pointer; }
        #yes-btn { background: #23c45e; color: white; }
        #no-btn { background: #f44336; color: white; position: fixed; }

        /* --- PLAYER DE MÚSICA RETRO --- */
        .music-player { 
            position: fixed; bottom: 0; left: 0; width: 94vw; margin: 0 3vw 20px 3vw;
            background: rgba(15, 15, 15, 0.85); padding: 15px; border-radius: 20px;
            backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.1); 
            z-index: 10; display: flex; align-items: stretch; gap: 15px;
        }
        .player-left { width: 50%; display: flex; flex-direction: column; }
        .player-right { width: 50%; }
        .cassette-container { position: relative; margin-top: 18px; }
        .player-gif-top { width: 100%; height: 85px; object-fit: cover; border-radius: 10px; border: 1px solid #fff; }
        
        /* Botões Mecânicos */
        .track-indicators { position: absolute; top: -20px; display: flex; gap: 5px; }
        .tape-btn { width: 26px; height: 18px; background: linear-gradient(to bottom, #fff, #b3b3b3); border-radius: 4px; box-shadow: 0 2px 2px #000; }
        .tape-btn.active-btn { background: #ff0000; transform: translateY(4px); }
        
        .player-controls { display: flex; gap: 6px; margin-top: 10px; }
        .player-controls button { flex: 1; font-size: 12px; padding: 10px 0; border-radius: 8px; border: none; }
        .player-gif-side { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="startExperience()">
        <div class="tap-text">
            <img src="snoopy.png" alt="Snoopy" class="start-snoopy">
            Tap to Open! ;)
        </div>
    </div>

    <img src="star4.gif" class="star-decoration star-top-left">
    <img src="star2.gif" class="star-decoration star-bottom-left">
    <img src="star1.gif" class="star-decoration star-top-right">
    <img src="star3.gif" class="star-decoration star-bottom-right">

    <div class="header-container">
        <h1>Olá, Mari!<span class="esnupi-subtitle">Minina Esnupi</span></h1>
        <img src="braum.gif" class="header-gif">
    </div>

    <div class="question-box">
        Queres ir dar um passeio e comer gelado?
        <span class="parenthesis-text">*Também pode ser pão de alho</span>
    </div>

    <div class="button-area">
        <button id="yes-btn" onclick="notifyMe()">Sim!</button>
        <button id="no-btn">Não</button>
    </div>

    <div class="music-player">
        <div class="player-left">
            <div class="cassette-container">
                <div class="track-indicators">
                    <div class="tape-btn active-btn"></div>
                    <div class="tape-btn"></div>
                    <div class="tape-btn"></div>
                    <div class="tape-btn"></div>
                </div>
                <img class="player-gif-top" src="static.gif">
            </div>
            <div class="player-controls">
                <button onclick="prevSong()">⏮</button>
                <button onclick="togglePlay()" id="play-btn">⏸</button>
                <button onclick="nextSong()">⏭</button>
            </div>
        </div>
        <div class="player-right">
            <img id="dynamic-gif" class="player-gif-side" src="gif1.gif">
        </div>
    </div>

    <audio id="myAudio" src="music.mp3" preload="auto"></audio>
    <audio id="clickAudio" src="cassette.mp3" preload="auto"></audio>

    <script>
        var songs = ['music.mp3', 'music2.mp3', 'music3.mp3', 'music4.mp3'];
        var gifs = ['gif1.gif', 'gif2.gif', 'gif3.gif', 'gif4.gif'];
        var currentSongIndex = 0, audio = document.getElementById('myAudio'), clickAudio = document.getElementById('clickAudio'), isPlaying = false, mobileSlipCount = 0;

        function startExperience() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').style.display = 'none', 600);
            audio.play().then(() => isPlaying = true);
        }

        function moveButton() {
            var btn = document.getElementById('no-btn');
            btn.style.left = Math.random() * (window.innerWidth - 160) + 5 + 'px';
            btn.style.top = Math.random() * (window.innerHeight - 300) + 150 + 'px';
        }

        document.getElementById('no-btn').addEventListener('mouseover', moveButton);
        document.getElementById('no-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(mobileSlipCount < 4) { mobileSlipCount++; moveButton(); }
            else alert("Está bem... 🥺");
        });

        function updateSong() {
            clickAudio.currentTime = 0; clickAudio.play();
            audio.src = songs[currentSongIndex];
            document.getElementById('dynamic-gif').src = gifs[currentSongIndex] + "?v=" + Date.now();
            document.querySelectorAll('.tape-btn').forEach((btn, i) => i === currentSongIndex ? btn.classList.add('active-btn') : btn.classList.remove('active-btn'));
            if(isPlaying) audio.play();
        }

        function nextSong() { currentSongIndex = (currentSongIndex + 1) % songs.length; updateSong(); }
        function prevSong() { currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; updateSong(); }
        function togglePlay() { if(isPlaying) { audio.pause(); isPlaying = false; } else { audio.play(); isPlaying = true; } }
        function notifyMe() { alert("Yay! 🥰❤️"); }
    </script>
</body>
</html>
